# Based on templates from:
# https://github.com/rushiranpise/morphe-patches
# Modified for this repository.
name: 🐞 Bug report
description: Report a bug or an issue in an app.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        # Bug Report
  - type: textarea
    id: bug_description
    attributes:
      label: Bug description
      description: |
        - Describe your bug in detail
        - Add steps to reproduce the bug if possible (Step 1. ... Step 2. ...)
        - Add images and videos if possible
    validations:
      required: true
  - type: input
    id: app_name
    attributes:
      label: App name
      placeholder: 'Anger of Stick 5, CubeX Solver, Oddmar, etc'
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      description: 'Please provide the version of the app that is causing the issue.'
      placeholder: '1.23.456'
    validations:
      required: true
  - type: input
    id: manager_or_cli_version
    attributes:
      label: Manager or CLI version
      description: 'Please provide the version of the Morphe Manager or Morphe CLI used.'
      placeholder: 'Manager v1.27.0'
    validations:
      required: true
  - type: input
    id: patch_release_version
    attributes:
      label: Patch source release
      description: 'Required: provide the Morphe patch release channel and build number used to create the patched APK.'
      placeholder: 'stable v1.13.0 or dev v1.14.0-dev.3'
    validations:
      required: true
  - type: textarea
    id: error_logs
    attributes:
      label: Error logs
      description: 'Paste the relevant patching or runtime logs.'
      render: shell
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Screenshots, videos, suspected cause, or anything else that may help.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: I followed the README log capture instructions and included the relevant logs.
          required: true
        - label: All requested information has been provided properly.
          required: true
